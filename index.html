<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quest Shooter 2 Pistolas</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 20px;
    line-height: 1.5;
    pointer-events: none;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 20px;
    height: 20px;
    transform: translate(-50%,-50%);
    z-index: 5;
    pointer-events: none;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: white;
}

#crosshair::before {
    width: 20px;
    height: 2px;
    left: 0;
    top: 9px;
}

#crosshair::after {
    width: 2px;
    height: 20px;
    left: 9px;
    top: 0;
}

#desktopMenu {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    background: linear-gradient(#050505,#151515);
}

#desktopMenu h1 {
    font-size: 48px;
    margin: 0 0 10px;
}

#desktopMenu p {
    color: #aaa;
}

#playButton {
    border: 0;
    border-radius: 12px;
    padding: 16px 35px;
    background: #e22;
    color: white;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
}

#playButton:hover {
    background: #f44;
}
</style>
</head>

<body>

<div id="hud">
    🎯 Puntos: <span id="score">0</span><br>
    ❤️ Vidas: <span id="lives">3</span>
</div>

<div id="crosshair"></div>

<div id="desktopMenu">
    <h1>🔫 QUEST SHOOTER</h1>

    <p>
        ¡Dos pistolas para destruir a los enemigos!
    </p>

    <button id="playButton">
        JUGAR
    </button>

    <p style="font-size:14px">
        En Quest 2 pulsa ENTER VR.<br>
        Después apunta a JUGAR y pulsa el gatillo.
    </p>
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { VRButton } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js";


// =====================================================
// ESCENA
// =====================================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x101018);

scene.fog =
    new THREE.Fog(
        0x101018,
        5,
        30
    );


// =====================================================
// CÁMARA
// =====================================================

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.01,
        100
    );

camera.position.set(
    0,
    1.6,
    0
);


// =====================================================
// RENDERER
// =====================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// BOTÓN ENTER VR
// =====================================================

const vrButton =
    VRButton.createButton(
        renderer
    );

document.body.appendChild(
    vrButton
);


// =====================================================
// LUCES
// =====================================================

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x333333,
        2
    )
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    5,
    8,
    5
);

scene.add(sun);


// =====================================================
// JUGADOR
// =====================================================

const player =
    new THREE.Group();

player.position.set(
    0,
    0,
    3
);

scene.add(player);

player.add(camera);


// =====================================================
// SUELO
// =====================================================

const floor =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            30,
            30
        ),
        new THREE.MeshStandardMaterial({
            color: 0x303030
        })
    );

floor.rotation.x =
    -Math.PI / 2;

scene.add(floor);


// =====================================================
// PAREDES
// =====================================================

function createWall(
    x,
    y,
    z,
    sx,
    sy,
    sz
) {

    const wall =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,
                sy,
                sz
            ),
            new THREE.MeshStandardMaterial({
                color: 0x202025
            })
        );

    wall.position.set(
        x,
        y,
        z
    );

    scene.add(wall);
}

createWall(
    0, 2.5, -10,
    20, 5, .2
);

createWall(
    -10, 2.5, 0,
    .2, 5, 20
);

createWall(
    10, 2.5, 0,
    .2, 5, 20
);


// =====================================================
// CREAR PISTOLA
// =====================================================

function createGun() {

    const gun =
        new THREE.Group();


    // Cuerpo

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .12,
                .14,
                .45
            ),
            new THREE.MeshStandardMaterial({
                color: 0x111111
            })
        );

    body.position.z =
        -0.22;

    gun.add(body);


    // Empuñadura

    const handle =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .10,
                .25,
                .11
            ),
            new THREE.MeshStandardMaterial({
                color: 0x181818
            })
        );

    handle.position.set(
        0,
        -0.17,
        -0.15
    );

    handle.rotation.x =
        0.2;

    gun.add(handle);


    // Cañón

    const barrel =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .035,
                .035,
                .30,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0x555555
            })
        );

    barrel.rotation.x =
        Math.PI / 2;

    barrel.position.z =
        -0.55;

    gun.add(barrel);


    // Luz del arma

    const light =
        new THREE.PointLight(
            0xff3333,
            0,
            2
        );

    light.position.z =
        -0.7;

    gun.add(light);

    gun.userData.flash =
        light;


    return gun;
}


// =====================================================
// MANDOS
// =====================================================

const controller1 =
    renderer.xr.getController(0);

const controller2 =
    renderer.xr.getController(1);

scene.add(controller1);
scene.add(controller2);


// =====================================================
// DOS PISTOLAS
// =====================================================

const gun1 =
    createGun();

const gun2 =
    createGun();


// La pistola derecha

gun1.position.set(
    0,
    -0.02,
    -0.03
);

controller1.add(
    gun1
);


// La pistola izquierda

gun2.position.set(
    0,
    -0.02,
    -0.03
);

controller2.add(
    gun2
);


// =====================================================
// MENÚ VR 3D
// =====================================================

const vrMenu =
    new THREE.Group();

vrMenu.visible = true;

scene.add(vrMenu);


// Fondo

const menuBackground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            2.5,
            1.7
        ),
        new THREE.MeshBasicMaterial({
            color: 0x080808,
            transparent: true,
            opacity: .92,
            side: THREE.DoubleSide
        })
    );

vrMenu.add(
    menuBackground
);


// Texto usando canvas

function createText(
    text,
    size,
    color
) {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 1024;
    canvas.height = 512;

    const ctx =
        canvas.getContext(
            "2d"
        );

    ctx.clearRect(
        0,
        0,
        1024,
        512
    );

    ctx.font =
        "bold " + size + "px Arial";

    ctx.fillStyle =
        color;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        text,
        512,
        256
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const material =
        new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true
        });

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                2,
                1
            ),
            material
        );

    return mesh;
}


// Título

const title =
    createText(
        "QUEST SHOOTER",
        90,
        "#ffffff"
    );

title.position.set(
    0,
    .48,
    .02
);

title.scale.set(
    1,
    .35,
    1
);

vrMenu.add(title);


// Botón

const startButton3D =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.5,
            .42,
            .08
        ),
        new THREE.MeshBasicMaterial({
            color: 0xdd2222
        })
    );

startButton3D.position.set(
    0,
    -.05,
    .03
);

vrMenu.add(
    startButton3D
);


// Texto del botón

const startText =
    createText(
        "JUGAR",
        100,
        "#ffffff"
    );

startText.position.set(
    0,
    -.05,
    .08
);

startText.scale.set(
    .65,
    .14,
    1
);

vrMenu.add(startText);


// Instrucción

const instruction =
    createText(
        "Apunta y pulsa el gatillo",
        55,
        "#bbbbbb"
    );

instruction.position.set(
    0,
    -.55,
    .03
);

instruction.scale.set(
    1,
    .18,
    1
);

vrMenu.add(instruction);


// =====================================================
// COLOCAR MENÚ DELANTE DEL JUGADOR
// =====================================================

function positionVRMenu() {

    const pos =
        new THREE.Vector3(
            0,
            1.6,
            -2.5
        );

    pos.applyMatrix4(
        camera.matrixWorld
    );

    vrMenu.position.copy(
        pos
    );

    vrMenu.lookAt(
        camera.getWorldPosition(
            new THREE.Vector3()
        )
    );
}


// =====================================================
// VARIABLES
// =====================================================

let score = 0;
let lives = 3;

let playing = false;

const enemies = [];
const bullets = [];

let spawnTimer = 0;


// =====================================================
// EMPEZAR PARTIDA
// =====================================================

function startGame() {

    score = 0;
    lives = 3;

    document.getElementById(
        "score"
    ).textContent = score;

    document.getElementById(
        "lives"
    ).textContent = lives;


    // Eliminar enemigos antiguos

    for (
        const enemy of enemies
    ) {

        scene.remove(
            enemy
        );
    }

    enemies.length = 0;


    // Eliminar balas

    for (
        const bullet of bullets
    ) {

        scene.remove(
            bullet
        );
    }

    bullets.length = 0;


    playing = true;

    vrMenu.visible = false;

    document.getElementById(
        "desktopMenu"
    ).style.display = "none";


    // Crear enemigos iniciales

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        spawnEnemy();
    }
}


// =====================================================
// GAME OVER
// =====================================================

function gameOver() {

    playing = false;

    vrMenu.visible = true;

    positionVRMenu();

    // Cambiar botón

    startText.material.map =
        createTextTexture(
            "JUGAR OTRA VEZ"
        );

    startText.material.needsUpdate =
        true;


    if (
        !renderer.xr.isPresenting
    ) {

        document.getElementById(
            "desktopMenu"
        ).style.display = "flex";
    }
}


// =====================================================
// TEXTURA PARA CAMBIAR BOTÓN
// =====================================================

function createTextTexture(
    text
) {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 1024;
    canvas.height = 512;

    const ctx =
        canvas.getContext(
            "2d"
        );

    ctx.clearRect(
        0,
        0,
        1024,
        512
    );

    ctx.font =
        "bold 80px Arial";

    ctx.fillStyle =
        "#ffffff";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        text,
        512,
        256
    );

    return new THREE.CanvasTexture(
        canvas
    );
}


// =====================================================
// ENEMIGO
// =====================================================

function spawnEnemy() {

    const enemy =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .55,
                .55,
                .55
            ),
            new THREE.MeshStandardMaterial({
                color: 0xff2222
            })
        );

    enemy.position.set(
        (Math.random() - .5) * 8,
        .5 + Math.random() * 1.8,
        -4 - Math.random() * 6
    );

    enemy.userData.speed =
        .3 + Math.random() * .25;

    scene.add(enemy);

    enemies.push(enemy);
}


// =====================================================
// DISPARAR
// =====================================================

function shoot(
    controller
) {

    if (!playing)
        return;


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        controller.quaternion
    );


    const origin =
        controller.getWorldPosition(
            new THREE.Vector3()
        );


    const bullet =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .045,
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color: 0xffff00
            })
        );

    bullet.position.copy(
        origin
    );

    bullet.userData.velocity =
        direction
        .clone()
        .multiplyScalar(18);

    scene.add(
        bullet
    );

    bullets.push(
        bullet
    );


    // Flash del arma

    const gun =
        controller === controller1
            ? gun1
            : gun2;

    gun.userData.flash.intensity =
        5;

    setTimeout(
        () => {

            gun.userData.flash.intensity =
                0;

        },
        60
    );
}


// =====================================================
// DISPARAR CON LOS DOS MANDOS
// =====================================================

controller1.addEventListener(
    "selectstart",
    () => {

        if (
            !playing &&
            vrMenu.visible
        ) {

            checkVRButton(
                controller1
            );

        } else {

            shoot(
                controller1
            );
        }
    }
);


controller2.addEventListener(
    "selectstart",
    () => {

        if (
            !playing &&
            vrMenu.visible
        ) {

            checkVRButton(
                controller2
            );

        } else {

            shoot(
                controller2
            );
        }
    }
);


// =====================================================
// RAYCAST DEL BOTÓN VR
// =====================================================

const buttonRaycaster =
    new THREE.Raycaster();

function checkVRButton(
    controller
) {

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        controller.quaternion
    );


    const origin =
        controller.getWorldPosition(
            new THREE.Vector3()
        );


    buttonRaycaster.set(
        origin,
        direction
    );


    const hits =
        buttonRaycaster.intersectObject(
            startButton3D
        );


    if (
        hits.length > 0
    ) {

        startGame();
    }
}


// =====================================================
// MOUSE
// =====================================================

window.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !== 0
        )
            return;

        if (
            renderer.xr.isPresenting
        )
            return;

        if (
            !playing
        ) {

            startGame();

            return;
        }


        const direction =
            new THREE.Vector3(
                0,
                0,
                -1
            );

        direction.applyQuaternion(
            camera.quaternion
        );


        const origin =
            camera.getWorldPosition(
                new THREE.Vector3()
            );


        const bullet =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .045,
                    8,
                    8
                ),
                new THREE.MeshBasicMaterial({
                    color: 0xffff00
                })
            );

        bullet.position.copy(
            origin
        );

        bullet.userData.velocity =
            direction
            .clone()
            .multiplyScalar(18);

        scene.add(
            bullet
        );

        bullets.push(
            bullet
        );
    }
);


// =====================================================
// ACTUALIZAR BALAS
// =====================================================

function updateBullets(
    delta
) {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];

        bullet.position.addScaledVector(
            bullet.userData.velocity,
            delta
        );


        if (
            bullet.position.length() > 40
        ) {

            scene.remove(
                bullet
            );

            bullets.splice(
                i,
                1
            );

            continue;
        }


        for (
            let j = enemies.length - 1;
            j >= 0;
            j--
        ) {

            const enemy =
                enemies[j];


            if (
                bullet.position.distanceTo(
                    enemy.position
                ) < .4
            ) {

                scene.remove(
                    enemy
                );

                scene.remove(
                    bullet
                );

                enemies.splice(
                    j,
                    1
                );

                bullets.splice(
                    i,
                    1
                );

                score++;

                document.getElementById(
                    "score"
                ).textContent =
                    score;

                break;
            }
        }
    }
}


// =====================================================
// ACTUALIZAR ENEMIGOS
// =====================================================

function updateEnemies(
    delta
) {

    const playerPosition =
        player.getWorldPosition(
            new THREE.Vector3()
        );


    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemies[i];


        const direction =
            playerPosition
            .clone()
            .sub(
                enemy.position
            )
            .normalize();


        enemy.position.addScaledVector(
            direction,
            enemy.userData.speed *
            delta
        );


        enemy.rotation.x +=
            delta;

        enemy.rotation.y +=
            delta;


        if (
            enemy.position.distanceTo(
                playerPosition
            ) < .7
        ) {

            scene.remove(
                enemy
            );

            enemies.splice(
                i,
                1
            );

            lives--;


            document.getElementById(
                "lives"
            ).textContent =
                lives;


            if (
                lives <= 0
            ) {

                gameOver();
            }
        }
    }
}


// =====================================================
// SPAWN
// =====================================================

function updateSpawner(
    delta
) {

    spawnTimer +=
        delta;


    if (
        spawnTimer > 1.5 &&
        enemies.length < 10
    ) {

        spawnTimer = 0;

        spawnEnemy();
    }
}


// =====================================================
// BOTÓN DESKTOP
// =====================================================

document.getElementById(
    "playButton"
).addEventListener(
    "click",
    () => {

        startGame();
    }
);


// =====================================================
// ENTER / SALIR DE VR
// =====================================================

renderer.xr.addEventListener(
    "sessionstart",
    () => {

        // Ocultamos el menú 2D

        document.getElementById(
            "desktopMenu"
        ).style.display =
            "none";


        // Si no estamos jugando,
        // mostramos menú 3D

        if (!playing) {

            vrMenu.visible = true;

            positionVRMenu();
        }
    }
);


renderer.xr.addEventListener(
    "sessionend",
    () => {

        if (!playing) {

            document.getElementById(
                "desktopMenu"
            ).style.display =
                "flex";
        }
    }
);


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


// =====================================================
// GAME LOOP
// =====================================================

const clock =
    new THREE.Clock();


renderer.setAnimationLoop(
    () => {

        const delta =
            Math.min(
                clock.getDelta(),
                .05
            );


        if (
            playing
        ) {

            updateBullets(
                delta
            );

            updateEnemies(
                delta
            );

            updateSpawner(
                delta
            );
        }


        // Actualizamos la posición
        // del menú si estamos en VR

        if (
            renderer.xr.isPresenting &&
            vrMenu.visible
        ) {

            // Solo colocarlo al principio
            // para que no persiga la cabeza

            if (
                !vrMenu.userData.positioned
            ) {

                positionVRMenu();

                vrMenu.userData.positioned =
                    true;
            }
        }


        renderer.render(
            scene,
            camera
        );
    }
);

</script>

</body>
</html>
